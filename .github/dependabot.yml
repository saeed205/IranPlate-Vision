version: 2
updates:
  # requirements.txt pins compatible *ranges*, not exact versions. Without
  # `widen`, Dependabot raises the lower bound instead ("numpy>=1.26" becomes
  # "numpy>=2.5"), which narrows the versions this project supports rather than
  # extending them. `widen` pushes the upper bound out and leaves the floor
  # alone, which is what a range is for.
  - package-ecosystem: pip
    directory: /
    versioning-strategy: widen
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # One PR for all action bumps rather than one per action.
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # The base image tracks a Python release that ultralytics and torch
      # publish wheels for. Major/minor jumps need a deliberate check that
      # those wheels exist, so only patch bumps are automated.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
