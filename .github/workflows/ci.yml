name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The detector and OCR models are loaded lazily, so the test suites run
      # without ultralytics/torch/hezar. Keeps CI to seconds instead of minutes.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile every module
        run: python -m compileall -q app.py db.py models.py plates.py camera_manager.py run_https.py scripts

      - name: Plate parsing, lookup and JSON API
        run: python scripts/test_plates.py

      - name: RTSP worker bookkeeping
        run: python scripts/test_camera_worker.py

  smoke:
    name: Smoke test (live server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Models are absent, so /detect answers 503 and the smoke test accounts
      # for that; every other endpoint is exercised for real.
      - name: Start server
        run: |
          python app.py > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/status > /dev/null && break
            sleep 1
          done

      - name: Run smoke test
        run: python scripts/smoke_test.py

      - name: Server log
        if: always()
        run: tail -40 server.log

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
